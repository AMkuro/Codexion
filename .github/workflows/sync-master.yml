name: Sync submission branch

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make
      - run: python3 tests/test_codexion.py
      - run: pipx install norminette && norminette includes srcs

  sync:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    concurrency: sync-master
    runs-on: ubuntu-latest
    env:
      # Subject: Makefile at root, *.c/*.h, README.md. Everything else stays on develop.
      SUBMIT: "Makefile README.md :(glob)**/*.c :(glob)**/*.h"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build master from develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          src=$(git rev-parse HEAD)
          if git ls-remote --exit-code --heads origin master; then
            git checkout -B master origin/master
          else
            git checkout --orphan master
          fi
          git rm -rqf --ignore-unmatch .
          git checkout "$src" -- $SUBMIT
          sed -i '/README_ja\.md/d' README.md && git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "submit: $(git log -1 --format=%s "$src")" -m "from develop $src"
          git push origin master
